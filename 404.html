<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Gilani Collection by Evelyn Michaelides</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/gilanilogo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Served by Cloudflare Pages with HTTP 404 for any URL that doesn't exist.
       All paths are root-absolute because this page can appear at any depth. -->
  <header class="site-header">
    <div class="shell shell--wide">
      <div class="site-header__inner">
        <a href="/" class="logo">
          <picture>
            <source type="image/avif" srcset="/images/logo/gilanilogo-36.avif 1x, /images/logo/gilanilogo-72.avif 2x, /images/logo/gilanilogo-108.avif 3x">
            <source type="image/webp" srcset="/images/logo/gilanilogo-36.webp 1x, /images/logo/gilanilogo-72.webp 2x, /images/logo/gilanilogo-108.webp 3x">
            <img class="logo__mark" src="/gilanilogo.jpg" alt="" aria-hidden="true" width="36" height="36">
          </picture>
          <span class="logo__text">
            <span class="logo__title">Gilani Collection</span>
            <span class="logo__subtitle">Evelyn Michaelides</span>
          </span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
          <span class="nav-toggle__bar"></span>
          <span class="nav-toggle__bar"></span>
          <span class="nav-toggle__bar"></span>
          <span class="sr-only">Toggle navigation</span>
        </button>
        <nav class="nav" id="primary-nav">
          <a href="/#work" class="nav__link">Work</a>
          <a href="/#about" class="nav__link">About</a>
          <a href="/#process" class="nav__link">Process</a>
          <a href="/#contact" class="nav__link">Contact</a>
          <a href="https://instagram.com/evelyn.michaelides" class="nav__link nav__link--icon" target="_blank" rel="noopener" aria-label="Instagram">
            <svg class="nav__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="4" y="4" width="16" height="16" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="12" cy="12" r="3.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="16.5" cy="7.5" r="0.9" fill="currentColor" />
            </svg>
            <span class="sr-only">Instagram</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <main class="gallery-page">
    <section class="section">
      <div class="shell">
        <header class="section__header">
          <span class="section__eyebrow"></span>
          <h1 class="section__title">Page not found</h1>
          <p class="section__lede">This page doesn’t exist, or the work has moved. Browse the full gallery instead.</p>
        </header>
        <div class="gallery-cta">
          <a class="button" href="/gallery">View Entire Gallery</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell">
      <div class="footer__inner">
        <span class="footer__text">© Evelyn Michaelides — <span data-current-year>2026</span></span>
        <div class="footer__links">
          <a class="footer__link" href="https://instagram.com/evelyn.michaelides" target="_blank" rel="noopener">Instagram</a>
          <a class="footer__link" href="mailto:evelyninc3@gmail.com">Email</a>
        </div>
      </div>
    </div>
  </footer>
  <script src="/script.js"></script>
</body>
</html>
